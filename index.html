<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>برنامه روزانه | The Ascent Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#070512;
    --bg2:#0b0a22;
    --border:rgba(148,120,255,.28);
    --border-soft:rgba(148,120,255,.16);
    --text:#f2eeff;
    --muted:#a79ed3;
    --dim:#746aa8;
    --violet:#8b5cf6;
    --violet-2:#a855f7;
    --red:#ff4d6d;
    --green:#39d98a;
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Vazirmatn',system-ui,sans-serif;
    color:var(--text);
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(124,58,237,.22), transparent 60%),
      radial-gradient(900px 600px at -10% 40%, rgba(236,72,153,.12), transparent 55%),
      radial-gradient(1000px 700px at 60% 110%, rgba(79,70,229,.18), transparent 55%),
      linear-gradient(160deg,var(--bg2),var(--bg) 55%);
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(139,92,246,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(139,92,246,.045) 1px,transparent 1px);
    background-size:46px 46px;
    pointer-events:none;
    z-index:0;
    -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%);
    mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%);
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(139,92,246,.4);border-radius:20px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(139,92,246,.65)}

  .shell{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:26px 22px 30px}

  /* Header */
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:6px 8px 20px}
  .title-block h1{
    font-size:clamp(30px,4.2vw,52px);font-weight:900;line-height:1.1;
    background:linear-gradient(180deg,#fff,#c9b6ff);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 4px 22px rgba(139,92,246,.35));
  }
  .title-block p{margin-top:8px;color:var(--muted);font-size:14px;font-weight:500;letter-spacing:.4px}
  .brand{display:flex;align-items:center;gap:14px;padding:10px 0 4px;flex-shrink:0}
  .brand-text{text-align:left;line-height:1.2;font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:3px;color:#cbbaff;text-transform:uppercase}
  .brand-text span:last-child{color:#8a76c9;letter-spacing:5px}
  .brand-logo{display:flex;gap:6px}
  .brand-logo i{width:13px;height:34px;border-radius:8px;background:linear-gradient(180deg,#c9a5ff,#7c3aed 60%,#4c1d95);box-shadow:0 0 14px rgba(168,85,247,.8)}
  .brand-logo i:nth-child(2){height:26px;align-self:center}
  .brand-logo i:nth-child(3){width:8px;height:30px;background:linear-gradient(180deg,#e3d1ff,#a855f7)}

  /* Panels */
  .panel,.date-card{
    position:relative;
    background:linear-gradient(180deg,rgba(36,29,84,.78),rgba(16,12,44,.72));
    border:1px solid rgba(148,120,255,.38);
    border-radius:var(--radius);
    box-shadow:0 0 0 1px rgba(148,120,255,.06),0 0 45px rgba(76,29,149,.22),inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(16px);
    overflow:hidden;
  }
  .panel::before,.date-card::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(600px 120px at 50% -20%,rgba(139,92,246,.18),transparent 70%);
  }

  .panel-head{display:flex;align-items:center;gap:10px;padding:18px 20px 14px}
  .panel-title{font-size:17px;font-weight:800;color:var(--text);text-shadow:0 0 18px rgba(168,85,247,.35)}
  .accent{width:7px;height:24px;border-radius:6px;flex-shrink:0;background:linear-gradient(180deg,#ff6b88,#e11d48);box-shadow:0 0 14px rgba(244,63,94,.7)}
  .head-spacer{flex:1}

  .add-btn{
    display:inline-flex;align-items:center;gap:5px;
    font-family:inherit;font-size:11.5px;font-weight:700;color:#e6dbff;
    background:rgba(139,92,246,.12);border:1px solid rgba(148,120,255,.28);
    border-radius:10px;padding:6px 11px;cursor:pointer;
    transition:background .2s,border-color .2s,transform .2s;
  }
  .add-btn:hover{background:rgba(139,92,246,.26);border-color:rgba(196,166,255,.55);transform:translateY(-1px)}
  .add-btn svg{width:13px;height:13px}

  /* Date + week + progress */
  .date-card{padding:24px 26px 20px;border-radius:26px;border-color:rgba(168,138,255,.42);background:linear-gradient(160deg,rgba(44,33,102,.82),rgba(14,10,40,.78));box-shadow:0 0 0 1px rgba(168,138,255,.07),0 0 60px rgba(88,28,180,.25),inset 0 1px 0 rgba(255,255,255,.07)}
  .date-line{position:relative;display:flex;align-items:center;gap:20px}
  .date-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;flex:1;min-width:280px;padding-top:2px}
  .date-label{display:inline-flex;align-items:center;gap:9px;font-size:20px;font-weight:900;color:#e9deff;text-shadow:0 0 22px rgba(196,166,255,.55)}
  .date-label::before{content:"📅";font-size:19px;filter:drop-shadow(0 0 8px rgba(168,85,247,.7))}
  .date-value{
    font-size:clamp(18px,2vw,23px);font-weight:800;color:#fff;cursor:pointer;
    border-bottom:2px dashed rgba(196,166,255,.5);padding-bottom:3px;letter-spacing:.2px;transition:color .2s,border-color .2s;
  }
  .date-value:hover{color:#d9c8ff;border-color:#c4a6ff}
  .today-btn{
    font-family:inherit;font-size:12.5px;font-weight:800;color:#f4ecff;
    background:linear-gradient(135deg,rgba(168,85,247,.28),rgba(109,40,217,.28));
    border:1px solid rgba(196,166,255,.42);padding:7px 15px;border-radius:30px;cursor:pointer;transition:.2s;
    box-shadow:0 0 16px rgba(139,92,246,.25);
  }
  .today-btn:hover{background:linear-gradient(135deg,rgba(168,85,247,.5),rgba(109,40,217,.5));transform:translateY(-1px)}

  .day-strip{flex:1.6;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;direction:rtl;position:relative}
  .day-pill{
    position:relative;font-family:inherit;cursor:pointer;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));
    border:1px solid rgba(168,138,255,.20);color:var(--muted);border-radius:18px;
    padding:12px 6px;text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.04);transition:.22s;overflow:hidden;
  }
  .day-pill small{display:block;font-size:11px;opacity:.78;margin-top:4px;font-weight:600}
  .day-pill b{font-size:14.5px;font-weight:900;display:block;letter-spacing:.3px}
  .day-pill:hover{border-color:rgba(196,166,255,.55);color:#fff;transform:translateY(-3px);box-shadow:0 10px 24px rgba(88,28,180,.28)}
  .day-pill.active{
    background:linear-gradient(150deg,#7c3aed,#a855f7 55%,#6d28d9);border-color:#d0b3ff;color:#fff;
    box-shadow:0 12px 30px rgba(124,58,237,.55),inset 0 1px 0 rgba(255,255,255,.25);transform:translateY(-2px);
  }
  .day-pill.active::after{content:"";position:absolute;left:20%;right:20%;bottom:-4px;height:5px;border-radius:50%;background:#e9d5ff;filter:blur(7px);opacity:.9}
  .day-pill.is-today{outline:1px solid rgba(57,217,138,.6);outline-offset:2px}

  .date-foot{
    position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;
    margin-top:20px;padding-top:18px;border-top:1px solid rgba(168,138,255,.16);
  }
  .progress-wrap{min-width:0}
  .progress-label{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:#cfc4ff;margin-bottom:8px;font-weight:700}
  .progress-label .prog-num{font-size:14px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(168,85,247,.55)}
  .progress-bar{height:11px;border-radius:30px;background:rgba(255,255,255,.07);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
  .progress-fill{
    height:100%;width:0;border-radius:30px;
    background:linear-gradient(90deg,#39d98a,#7c3aed,#a855f7,#f0abfc);background-size:200% 100%;
    box-shadow:0 0 18px rgba(168,85,247,.7);transition:width .5s ease;
  }
  .progress-center{display:grid;place-items:center;flex-shrink:0}
  .progress-ring{
    --p:0;position:relative;width:58px;height:58px;border-radius:50%;
    background:conic-gradient(#c084fc calc(var(--p)*1%),rgba(255,255,255,.10) 0);
    display:grid;place-items:center;box-shadow:0 0 26px rgba(168,85,247,.5),inset 0 0 12px rgba(168,85,247,.25);
  }
  .progress-ring::before{content:"";position:absolute;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#241a55,#0e0a2c)}
  .progress-ring span{position:relative;font-size:12px;font-weight:900;color:#fff;z-index:1;text-shadow:0 0 10px rgba(168,85,247,.7)}

  /* Main layout */
  .layout{display:flex;flex-direction:column;gap:22px}
  .main-area{display:flex;flex-direction:column;gap:22px;min-width:0}

  .program-bottom{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 18px 18px;margin-top:4px;border-top:1px solid rgba(148,120,255,.14)}
  .sub-section{background:rgba(10,8,26,.42);border:1px solid rgba(148,120,255,.18);border-radius:16px;overflow:hidden}
  .sub-head{display:flex;align-items:center;gap:9px;padding:14px 14px 2px}
  .sub-head .panel-title{font-size:15px}
  .sub-head .add-btn{font-size:10.5px;padding:5px 9px}
  .sub-section .list-body{padding:2px 10px 10px}

  /* Todos */
  .list-body{padding:4px 16px 18px}
  .empty{text-align:center;color:var(--dim);font-size:13px;padding:26px 10px;border:1px dashed rgba(148,120,255,.28);border-radius:16px;margin:4px}
  .empty button{font-family:inherit;color:#cbbaff;background:none;border:none;cursor:pointer;font-weight:700;margin-top:8px;font-size:13px}
  .empty button:hover{text-decoration:underline}

  .todo-row{display:flex;align-items:center;gap:10px;padding:11px 8px;border-bottom:1px solid rgba(148,120,255,.12);animation:rowIn .28s ease;position:relative}
  .todo-row:last-child{border-bottom:none}
  @keyframes rowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .check{
    width:24px;height:24px;border-radius:8px;flex-shrink:0;cursor:pointer;
    border:2px solid rgba(224,107,255,.75);
    background:linear-gradient(180deg,rgba(40,28,80,.6),rgba(22,16,52,.6));
    box-shadow:inset 0 0 10px rgba(0,0,0,.35),0 0 10px rgba(168,85,247,.2);
    display:grid;place-items:center;transition:.18s;
  }
  .check svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:.18s;color:#0a0716}
  .todo-row.done .check{background:linear-gradient(135deg,#39d98a,#22c55e);border-color:#7ce7b1;box-shadow:0 0 14px rgba(57,217,138,.55)}
  .todo-row.done .check svg{opacity:1;transform:scale(1)}

  .row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .todo-input{
    font-family:inherit;font-size:15.5px;font-weight:600;color:#eee9ff;
    background:transparent;border:none;outline:none;padding:6px 0;width:100%;line-height:1.6;
  }
  .todo-input::placeholder{color:var(--dim);font-weight:500}
  .todo-input:placeholder-shown{
    background-image:repeating-linear-gradient(90deg,rgba(190,160,255,.38) 0 2px,transparent 2px 7px);
    background-repeat:repeat-x;background-position:0 86%;background-size:100% 1px;
  }
  .todo-row.done .todo-input{color:#8f86ba;text-decoration:line-through}
  .row-num{width:26px;min-width:26px;text-align:center;font-size:14px;font-weight:800;color:#c9b4ff;flex-shrink:0}

  .row-actions{display:flex;gap:4px;opacity:0;transform:translateX(6px);transition:.18s}
  .todo-row:hover .row-actions{opacity:1;transform:none}
  .icon-btn{width:28px;height:28px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,.04);color:var(--muted);display:grid;place-items:center;transition:.18s}
  .icon-btn svg{width:14px;height:14px}
  .icon-btn:hover{color:#fff;background:rgba(139,92,246,.22);border-color:var(--border)}
  .icon-btn.del:hover{color:#ffb3c0;background:rgba(244,63,94,.22);border-color:rgba(244,63,94,.4)}

  /* برنامه امروز planner */
  .planner{padding:6px 20px 20px;position:relative}
  .planner-row{display:flex;align-items:stretch;direction:rtl;border-bottom:1px solid rgba(148,120,255,.16);min-height:84px;padding:0;animation:rowIn .28s ease}
  .planner-row:last-child{border-bottom:none}
  .planner-body{flex:1;min-width:0;direction:rtl;display:flex;align-items:center;gap:16px;padding:14px 22px}
  .planner-body > .check{flex-shrink:0}
  .planner-body > .row-body{flex:1;min-width:0}
  .planner-body .todo-input{font-size:17px;line-height:1.7}
  .planner .empty{margin:0}

  /* Lessons lined paper */
  .lessons-panel{margin-top:22px}
  .paper-outer{padding:6px 22px 20px}
  .paper{
    position:relative;background:linear-gradient(180deg,rgba(24,19,58,.55),rgba(15,12,40,.55));
    border:1px solid rgba(148,120,255,.25);border-radius:16px;padding:18px 18px 6px;
    min-height:260px;max-height:520px;overflow:auto;
  }
  .paper::before{
    content:"";position:absolute;inset:14px 10px 14px 10px;pointer-events:none;
    background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 43px,rgba(190,160,255,.28) 43px,rgba(190,160,255,.28) 44px);
    border-radius:8px;
  }
  .paper .ruler{position:absolute;inset:14px 10px 14px 10px;pointer-events:none;border-right:2px solid rgba(255,77,109,.5);border-radius:2px 0 0 2px}
  .paper-content{
    position:relative;outline:none;font-family:'Vazirmatn',sans-serif;
    font-size:16.5px;font-weight:600;color:#efe9ff;line-height:44px;min-height:210px;white-space:pre-wrap;word-break:break-word;
  }
  .paper-content:empty::before{content:"درس‌های امروز را اینجا بنویس...";color:var(--dim);font-weight:500}
  .paper-footer{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 2px;color:var(--dim);font-size:11.5px}

  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding:16px 6px 4px;color:#5f5789;font-size:12px;border-top:1px solid rgba(148,120,255,.12)}
  .footer b{color:#cbbaff;letter-spacing:1px}

  /* Calendar modal */
  .modal-veil{position:fixed;inset:0;z-index:50;display:none;background:rgba(4,3,16,.6);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px}
  .modal-veil.open{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    width:min(380px,100%);background:linear-gradient(180deg,#1b1544,#110d30);border:1px solid var(--border);
    border-radius:22px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(124,58,237,.25);animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-title{font-size:16px;font-weight:800;color:#fff}
  .cal-nav{display:flex;gap:6px}
  .icon-btn.round{border-radius:10px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:rtl}
  .cal-dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
  .cal-day{font-family:inherit;font-size:13px;font-weight:700;color:#d9d0ff;background:rgba(255,255,255,.04);border:1px solid transparent;border-radius:10px;height:38px;cursor:pointer;transition:.15s}
  .cal-day:hover{background:rgba(139,92,246,.25);border-color:var(--border)}
  .cal-day.dim{opacity:.32;color:var(--muted)}
  .cal-day.today{border:1px solid rgba(57,217,138,.55);color:#7ce7b1}
  .cal-day.selected{background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;box-shadow:0 6px 16px rgba(124,58,237,.5)}
  .cal-foot{display:flex;justify-content:center;margin-top:16px}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#201743;border:1px solid var(--border);color:#eee9ff;padding:10px 18px;
    border-radius:14px;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:.25s;z-index:80;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .fade-in{animation:fadeUp .5s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* Responsive */
  @media(max-width:880px){
    .date-line{flex-direction:column;align-items:stretch;gap:16px}
    .date-row{width:100%}
    .day-strip{width:100%}
    .date-foot{grid-template-columns:1fr;gap:14px}
    .progress-center{justify-self:center}
    .program-bottom{grid-template-columns:1fr}
  }
  @media(max-width:560px){
    .shell{padding:16px 12px 22px}
    .topbar{flex-direction:column;gap:6px}
    .brand{padding:0}
    .day-strip{gap:5px}
    .day-pill{padding:7px 3px}
    .day-pill b{font-size:12px}
  }
</style>
</head>
<body>
<div class="shell">

  <header class="topbar fade-in">
    <div class="title-block">
      <h1>برنامه روزانه</h1>
      <p>هر روز یک قدم جلوتر ✦</p>
    </div>
    <div class="brand">
      <div class="brand-text"><span>The Ascent</span><br/><span>Blueprint</span></div>
      <div class="brand-logo"><i></i><i></i><i></i></div>
    </div>
  </header>

  <section class="date-card fade-in" style="animation-delay:.05s">
    <div class="date-line">
      <div class="date-row">
        <span class="date-label">تاریخ:</span>
        <span class="date-value" id="dateValue" title="برای انتخاب تاریخ کلیک کنید"></span>
        <button class="today-btn" id="todayBtn">امروز</button>
        <div class="head-spacer"></div>
        <button class="add-btn" id="openCalBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          تقویم
        </button>
      </div>
      <div class="day-strip" id="dayStrip"></div>
    </div>

    <div class="date-foot">
      <div class="progress-wrap">
        <div class="progress-label"><span>پیشرفت امروز</span><span class="prog-num" id="progressPct">۰٪</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
      </div>
      <div class="progress-center">
        <div class="progress-ring" id="progressRing"><span id="progressRingVal">۰٪</span></div>
      </div>
      <div class="progress-wrap">
        <div class="progress-label"><span>تکمیل‌شده</span><span class="prog-num" id="progressCount">۰ از ۰</span></div>
        <div class="progress-bar"><div class="progress-fill" id="progressBar2"></div></div>
      </div>
    </div>
  </section>

  <div class="layout">
    <section class="main-area">
      <div class="panel fade-in" style="animation-delay:.1s">
        <div class="panel-head">
          <span class="accent"></span>
          <h2 class="panel-title">برنامه امروز</h2>
          <div class="head-spacer"></div>
          <button class="add-btn" onclick="app.addItem('program')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            افزودن
          </button>
        </div>
        <div class="list-body planner" id="programList"></div>

        <div class="program-bottom">
          <section class="sub-section">
            <div class="sub-head">
              <span class="accent"></span>
              <h2 class="panel-title">اولویت کارها</h2>
              <div class="head-spacer"></div>
              <button class="add-btn" onclick="app.addItem('priorities')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                افزودن
              </button>
            </div>
            <div class="list-body" id="prioList"></div>
          </section>

          <section class="sub-section">
            <div class="sub-head">
              <span class="accent"></span>
              <h2 class="panel-title">اهداف امروز</h2>
              <div class="head-spacer"></div>
              <button class="add-btn" onclick="app.addItem('goals')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                افزودن
              </button>
            </div>
            <div class="list-body" id="goalList"></div>
          </section>
        </div>
      </div>
    </section>
  </div>

  <section class="panel lessons-panel fade-in" style="animation-delay:.24s">
    <div class="panel-head">
      <span class="accent"></span>
      <h2 class="panel-title">درس‌هایی که امروز گفتم</h2>
    </div>
    <div class="paper-outer">
      <div class="paper">
        <div class="ruler"></div>
        <div class="paper-content" id="lessonsContent" contenteditable="true" spellcheck="false"></div>
      </div>
      <div class="paper-footer">
        <span id="lessonsCount">۰ کلمه</span>
        <span>ذخیره‌ی خودکار ✍</span>
      </div>
    </div>
  </section>

  <footer class="footer fade-in" style="animation-delay:.3s">
    <span>روز صفر تا قله ✦</span>
    <span><b>THE ASCENT BLUEPRINT</b> · DAILY</span>
  </footer>
</div>

<div class="modal-veil" id="modal">
  <div class="modal">
    <div class="cal-head">
      <span class="cal-title" id="calTitle"></span>
      <div class="cal-nav">
        <button class="icon-btn round" id="calPrev" title="ماه قبل">‹</button>
        <button class="icon-btn round" id="calNext" title="ماه بعد">›</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-foot"><button class="today-btn" id="calToday">برو به امروز</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'ascent_daily_final_v1';
  const WEEK_FA = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
  const MONTH_FA = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

  const DEFAULTS = { program: 6, priorities: 5, goals: 4 };

  /* ---------- pure helpers ---------- */
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const faNumber = (n) => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const sameDay = (a, b) => !!a && !!b && a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
  const dateLong = (d) => new Intl.DateTimeFormat('fa-IR', { weekday:'long', day:'numeric', month:'long', year:'numeric' }).format(d);
  const startOfWeek = (d) => {
    const offset = (d.getDay() + 1) % 7; // 0 = Saturday
    const s = new Date(d); s.setDate(d.getDate() - offset); s.setHours(0,0,0,0);
    return s;
  };
  const escapeAttr = (s) => String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const $ = (id) => document.getElementById(id);

  /* ---------- state ---------- */
  const today = new Date();
  let selectedDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let calendarDate = new Date(selectedDate.getTime());
  let data = null;

  const blankItem = () => ({ id: uid(), text: '', done: false });
  const blankData = () => ({
    program: Array.from({ length: DEFAULTS.program }, blankItem),
    priorities: Array.from({ length: DEFAULTS.priorities }, blankItem),
    goals: Array.from({ length: DEFAULTS.goals }, blankItem),
    lessons: ''
  });

  const loadData = () => {
    const saved = localStorage.getItem(STORAGE_KEY + ':' + iso(selectedDate));
    if (saved) {
      try {
        data = Object.assign(blankData(), JSON.parse(saved));
      } catch { data = blankData(); }
    } else {
      data = blankData();
      localStorage.setItem(STORAGE_KEY + ':' + iso(selectedDate), JSON.stringify(data));
    }
  };
  const saveData = () => localStorage.setItem(STORAGE_KEY + ':' + iso(selectedDate), JSON.stringify(data));
  const persist = (render = true) => {
    saveData();
    if (render) app.renderAll();
  };

  /* ---------- todo list rendering ---------- */
  const renderTodos = (list, containerId, opts = {}) => {
    const items = data[list];
    const wrap = $(containerId);
    wrap.innerHTML = '';

    if (!items.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.innerHTML = `<div>${opts.empty || 'هنوز موردی اضافه نکرده‌اید.'}</div><button onclick="app.addItem('${list}')">+ افزودن اولین مورد</button>`;
      wrap.appendChild(empty);
      return;
    }

    items.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = `todo-row${item.done ? ' done' : ''}${opts.planner ? ' planner-row' : ''}`;
      row.dataset.id = item.id;

      const actions = `
        <div class="row-actions">
          <button class="icon-btn" title="ویرایش" onclick="app.focusRow(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
          <button class="icon-btn del" title="حذف" onclick="app.removeItem('${list}','${item.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
        </div>`;

      const check = `
        <button class="check" onclick="app.toggleItem('${list}','${item.id}')" aria-label="تکمیل">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </button>`;

      const input = `
        <div class="row-body">
          <input class="todo-input" value="${escapeAttr(item.text)}" placeholder=""
            oninput="app.updateItemLive('${list}','${item.id}',this.value)"
            onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}" />
        </div>`;

      if (opts.planner) {
        row.innerHTML = `
          <div class="planner-body">${check}${input}${actions}</div>`;
      } else {
        row.innerHTML = `${check}${input}${actions}${opts.numbered ? `<span class="row-num">${faNumber(idx + 1)}</span>` : ''}`;
      }
      wrap.appendChild(row);
    });
  };

  /* ---------- date bar ---------- */
  const renderDayStrip = () => {
    const wrap = $('dayStrip');
    wrap.innerHTML = '';
    const start = startOfWeek(selectedDate);
    WEEK_FA.forEach((weekday, i) => {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const btn = document.createElement('button');
      btn.className = 'day-pill' + (sameDay(d, selectedDate) ? ' active' : '') + (sameDay(d, today) ? ' is-today' : '');
      btn.innerHTML = `<b>${weekday}</b><small>${faNumber(d.getDate() + ' ' + MONTH_FA[d.getMonth()])}</small>`;
      btn.onclick = () => app.selectDate(new Date(d));
      wrap.appendChild(btn);
    });
  };

  const renderCalendar = () => {
    $('calTitle').textContent = `${MONTH_FA[calendarDate.getMonth()]} ${faNumber(calendarDate.getFullYear())}`;
    const grid = $('calGrid');
    grid.innerHTML = '';
    WEEK_FA.forEach(w => {
      const el = document.createElement('div');
      el.className = 'cal-dow'; el.textContent = w;
      grid.appendChild(el);
    });
    const start = startOfWeek(new Date(calendarDate.getFullYear(), calendarDate.getMonth(), 1));
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const btn = document.createElement('button');
      btn.className = 'cal-day';
      if (d.getMonth() !== calendarDate.getMonth()) btn.classList.add('dim');
      if (sameDay(d, today)) btn.classList.add('today');
      if (sameDay(d, selectedDate)) btn.classList.add('selected');
      btn.textContent = faNumber(d.getDate());
      btn.onclick = () => app.selectDate(new Date(d));
      grid.appendChild(btn);
    }
  };

  const renderProgress = () => {
    const lists = [data.program, data.priorities, data.goals];
    const total = lists.reduce((s, l) => s + l.length, 0);
    const done = lists.reduce((s, l) => s + l.filter(x => x.done).length, 0);
    const pct = total ? Math.round(done / total * 100) : 0;
    $('progressBar').style.width = pct + '%';
    $('progressBar2').style.width = pct + '%';
    $('progressRing').style.setProperty('--p', pct);
    $('progressPct').textContent = faNumber(pct) + '٪';
    $('progressRingVal').textContent = faNumber(pct) + '٪';
    $('progressCount').textContent = `${faNumber(done)} از ${faNumber(total)}`;
  };

  const renderLessons = () => {
    $('lessonsContent').innerText = data.lessons || '';
    app.updateLessonCount();
  };

  const renderAll = () => {
    $('dateValue').textContent = dateLong(selectedDate);
    renderDayStrip();
    renderCalendar();
    renderTodos('program', 'programList', { planner: true, empty: 'برنامه‌ی امروز خالی است.' });
    renderTodos('priorities', 'prioList', { numbered: true, empty: 'اولویت کاری ثبت نشده.' });
    renderTodos('goals', 'goalList', { empty: 'هنوز هدفی برای امروز ثبت نشده.' });
    renderLessons();
    renderProgress();
  };

  /* ---------- toast ---------- */
  let toastTimer;
  const toast = (msg) => {
    const el = $('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  };

  /* ---------- public app API (used by inline handlers) ---------- */
  const app = {
    addItem(list) {
      data[list].push(blankItem());
      persist();
      requestAnimationFrame(() => {
        const map = { program: 'programList', priorities: 'prioList', goals: 'goalList' };
        const inputs = document.querySelectorAll('#' + map[list] + ' .todo-input');
        if (inputs.length) inputs[inputs.length - 1].focus();
      });
    },
    updateItemLive(list, id, text) {
      const item = data[list].find(x => x.id === id);
      if (item && item.text !== text) { item.text = text; persist(false); }
    },
    toggleItem(list, id) {
      const item = data[list].find(x => x.id === id);
      if (item) { item.done = !item.done; persist(); }
    },
    removeItem(list, id) {
      data[list] = data[list].filter(x => x.id !== id);
      persist();
    },
    focusRow(btn) {
      const input = btn.closest('.todo-row').querySelector('.todo-input');
      if (input) { input.focus(); input.select(); }
    },
    selectDate(d) {
      selectedDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      calendarDate = new Date(selectedDate);
      app.closeModal();
      loadData();
      renderAll();
      toast('تاریخ تغییر کرد ✦');
    },
    openModal() {
      calendarDate = new Date(selectedDate);
      renderCalendar();
      $('modal').classList.add('open');
    },
    closeModal() { $('modal').classList.remove('open'); },
    updateLessonCount() {
      const text = ($('lessonsContent').innerText || '').trim();
      $('lessonsCount').textContent = `${faNumber(text ? text.split(/\s+/).length : 0)} کلمه`;
    },
    renderAll
  };

  /* ---------- init & bindings ---------- */
  const bind = () => {
    $('dateValue').addEventListener('click', app.openModal);
    $('openCalBtn').addEventListener('click', app.openModal);
    $('todayBtn').addEventListener('click', () => app.selectDate(new Date(today)));
    $('calToday').addEventListener('click', () => app.selectDate(new Date(today)));
    $('calPrev').addEventListener('click', () => { calendarDate.setMonth(calendarDate.getMonth() - 1); renderCalendar(); });
    $('calNext').addEventListener('click', () => { calendarDate.setMonth(calendarDate.getMonth() + 1); renderCalendar(); });
    $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') app.closeModal(); });
    window.addEventListener('keydown', (e) => { if (e.key === 'Escape') app.closeModal(); });

    $('lessonsContent').addEventListener('input', (e) => {
      data.lessons = e.target.innerText;
      persist(false);
      app.updateLessonCount();
    });
  };

  loadData();
  bind();
  renderAll();
  window.app = app;
})();
</script>
</body>
</html>
