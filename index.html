<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>برنامه روزانه | The Ascent Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#070512;
    --bg2:#0b0a22;
    --panel:rgba(27,22,66,.62);
    --panel-solid:#17123a;
    --border:rgba(148,120,255,.28);
    --border-soft:rgba(148,120,255,.16);
    --text:#f2eeff;
    --muted:#a79ed3;
    --dim:#746aa8;
    --violet:#8b5cf6;
    --violet-2:#a855f7;
    --red:#ff4d6d;
    --green:#39d98a;
    --teal:#2dd4bf;
    --radius:22px;
    --shadow:0 20px 60px rgba(0,0,0,.45);
    --glow:0 0 30px rgba(139,92,246,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Vazirmatn',system-ui,sans-serif;
    color:var(--text);
    min-height:100vh;
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(124,58,237,.22), transparent 60%),
      radial-gradient(900px 600px at -10% 40%, rgba(236,72,153,.12), transparent 55%),
      radial-gradient(1000px 700px at 60% 110%, rgba(79,70,229,.18), transparent 55%),
      linear-gradient(160deg,var(--bg2),var(--bg) 55%);
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(139,92,246,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(139,92,246,.045) 1px,transparent 1px);
    background-size:46px 46px;
    pointer-events:none;
    z-index:0;
    -webkit-mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%);
    mask-image:radial-gradient(circle at 50% 30%,#000 0%,transparent 78%);
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(139,92,246,.4);border-radius:20px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(139,92,246,.65)}

  .shell{
    position:relative;z-index:1;
    max-width:1240px;margin:0 auto;
    padding:26px 22px 30px;
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:20px;padding:6px 8px 20px;
  }
  .title-block h1{
    font-size:clamp(30px,4.2vw,52px);
    font-weight:900;line-height:1.1;
    background:linear-gradient(180deg,#fff,#c9b6ff);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    filter:drop-shadow(0 4px 22px rgba(139,92,246,.35));
  }
  .title-block p{
    margin-top:8px;color:var(--muted);font-size:14px;font-weight:500;
    letter-spacing:.4px;
  }
  .brand{
    display:flex;align-items:center;gap:14px;
    padding:10px 0 4px;flex-shrink:0;
  }
  .brand-text{
    text-align:left;line-height:1.2;
    font-family:'Orbitron',sans-serif;font-weight:700;
    font-size:13px;letter-spacing:3px;color:#cbbaff;
    text-transform:uppercase;
  }
  .brand-text span:last-child{color:#8a76c9;letter-spacing:5px}
  .brand-logo{
    display:flex;gap:6px;
  }
  .brand-logo i{
    width:13px;height:34px;border-radius:8px;
    background:linear-gradient(180deg,#c9a5ff,#7c3aed 60%,#4c1d95);
    box-shadow:0 0 14px rgba(168,85,247,.8);
  }
  .brand-logo i:nth-child(2){height:26px;align-self:center}
  .brand-logo i:nth-child(3){width:8px;height:30px;background:linear-gradient(180deg,#e3d1ff,#a855f7)}

  /* ---------- Cards ---------- */
  .panel,.date-card{
    position:relative;
    background:linear-gradient(180deg,rgba(36,29,84,.78),rgba(16,12,44,.72));
    border:1px solid rgba(148,120,255,.38);
    border-radius:var(--radius);
    box-shadow:
      0 0 0 1px rgba(148,120,255,.06),
      0 0 45px rgba(76,29,149,.22),
      inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(16px);
    overflow:hidden;
  }
  .panel::before{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:
      radial-gradient(600px 120px at 50% -20%,rgba(139,92,246,.18),transparent 70%),
      linear-gradient(180deg,rgba(148,120,255,.05),transparent 30%);
  }

  .panel-head{
    display:flex;align-items:center;gap:10px;
    padding:18px 20px 14px;
  }
  .panel-title{
    font-size:17px;font-weight:800;color:var(--text);
    text-shadow:0 0 18px rgba(168,85,247,.35);
  }
  .accent{
    width:7px;height:24px;border-radius:6px;flex-shrink:0;
    background:linear-gradient(180deg,#ff6b88,#e11d48);
    box-shadow:0 0 14px rgba(244,63,94,.7);
  }
  .head-spacer{flex:1}
  .count-badge{
    font-size:12px;font-weight:700;color:#d8cfff;
    background:rgba(139,92,246,.16);border:1px solid rgba(148,120,255,.3);
    padding:4px 10px;border-radius:30px;white-space:nowrap;
  }
  .add-btn{
    display:inline-flex;align-items:center;gap:5px;
    font-family:inherit;font-size:11.5px;font-weight:700;color:#e6dbff;
    background:rgba(139,92,246,.12);
    border:1px solid rgba(148,120,255,.28);
    border-radius:10px;padding:6px 11px;cursor:pointer;
    transition:background .2s,border-color .2s,transform .2s;
  }
  .add-btn:hover{background:rgba(139,92,246,.26);border-color:rgba(196,166,255,.55);transform:translateY(-1px)}
  .add-btn:active{transform:translateY(0)}
  .add-btn svg{width:13px;height:13px}

  /* ---------- Date card + calendar ---------- */
  .date-card{
    display:flex;flex-direction:column;gap:16px;
    margin-bottom:22px;padding:20px 22px 18px;
  }
  .date-card{padding:22px 24px 18px}
  .date-line{
    display:flex;align-items:center;gap:20px;
  }
  .date-row{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    flex:1;min-width:260px;padding-top:2px;
  }
  .day-strip{flex:1.35}
  .date-label{
    font-size:18px;font-weight:800;color:var(--violet-2);
    text-shadow:0 0 16px rgba(168,85,247,.5);
  }
  .date-value{
    font-size:clamp(17px,2.2vw,22px);font-weight:700;color:#fff;
    cursor:pointer;border-bottom:1px dashed rgba(148,120,255,.5);
    padding-bottom:2px;transition:color .2s;
  }
  .date-value:hover{color:#d9c8ff}
  .today-btn{
    font-family:inherit;font-size:12px;font-weight:700;color:#e9ddff;
    background:rgba(139,92,246,.16);border:1px solid rgba(148,120,255,.32);
    padding:6px 13px;border-radius:30px;cursor:pointer;transition:.2s;
  }
  .today-btn:hover{background:rgba(139,92,246,.34)}

  .day-strip{
    display:grid;grid-template-columns:repeat(7,1fr);gap:10px;
    direction:ltr;
  }
  .day-pill{
    font-family:inherit;cursor:pointer;
    background:rgba(255,255,255,.04);border:1px solid var(--border-soft);
    color:var(--muted);border-radius:14px;
    padding:9px 6px;text-align:center;transition:.2s;
  }
  .day-pill small{display:block;font-size:11px;opacity:.75;margin-top:2px;font-weight:500}
  .day-pill b{font-size:14px;font-weight:800;display:block}
  .day-pill:hover{border-color:var(--violet-2);color:#fff;transform:translateY(-2px)}
  .day-pill.active{
    background:linear-gradient(135deg,rgba(168,85,247,.9),rgba(109,40,217,.9));
    border-color:#c4a6ff;color:#fff;
    box-shadow:0 8px 24px rgba(124,58,237,.5);
  }
  .day-pill.is-today{outline:1px solid rgba(57,217,138,.55);outline-offset:2px}

  .date-foot{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .progress-wrap{flex:1;min-width:220px}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:600}
  .progress-bar{height:9px;border-radius:30px;background:rgba(255,255,255,.06);overflow:hidden}
  .progress-fill{
    height:100%;width:0;border-radius:30px;
    background:linear-gradient(90deg,#39d98a,#7c3aed,#a855f7);
    box-shadow:0 0 14px rgba(57,217,138,.6);
    transition:width .5s ease;
  }
  .progress-ring{
    --p:0;
    position:relative;
    width:46px;height:46px;border-radius:50%;
    background:conic-gradient(#a855f7 calc(var(--p)*1%),rgba(255,255,255,.08) 0);
    display:grid;place-items:center;flex-shrink:0;
    box-shadow:0 0 18px rgba(168,85,247,.4);
  }
  .progress-ring::before{content:"";position:absolute;width:38px;height:38px;border-radius:50%;background:#100d2c}
  .progress-ring span{position:relative;font-size:11px;font-weight:800;color:#fff;z-index:1}

  /* ---------- Layout ---------- */
  .layout{
    display:flex;flex-direction:column;gap:22px;
  }
  .main-area{display:flex;flex-direction:column;gap:22px;min-width:0}
  .bottom-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:22px;
  }
  /* اولویت‌ها و اهداف در پایین کادر «برنامه امروز» */
  .program-bottom{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
    padding:0 18px 18px;
    margin-top:4px;
    border-top:1px solid rgba(148,120,255,.14);
  }
  .sub-section{
    background:rgba(10,8,26,.42);
    border:1px solid rgba(148,120,255,.18);
    border-radius:16px;
    overflow:hidden;
  }
  .sub-head{
    display:flex;align-items:center;gap:9px;
    padding:14px 14px 2px;
  }
  .sub-head .panel-title{font-size:15px}
  .sub-head .add-btn{font-size:10.5px;padding:5px 9px}
  .sub-section .list-body{padding:2px 10px 10px}

  /* ---------- Todos ---------- */
  .list-body{padding:4px 16px 18px}

  /* Planner grid for برنامه امروز (like the original design) */
  .planner{padding:6px 20px 20px;position:relative}
  .planner-row{
    display:grid;grid-template-columns:42px 1fr;
    direction:ltr;
    border-bottom:1px solid rgba(148,120,255,.16);
    min-height:78px;padding:0;
    animation:rowIn .28s ease;
  }
  .planner-row:last-child{border-bottom:none}
  .planner-num{
    display:flex;align-items:center;justify-content:center;
    border-right:1px solid rgba(148,120,255,.30);
    background:linear-gradient(90deg,rgba(139,92,246,.07),transparent);
    color:#c9b4ff;font-size:16px;font-weight:800;
  }
  .planner-body{
    display:flex;align-items:center;gap:14px;min-width:0;
    direction:rtl;
    padding:12px 18px;
  }
  .planner-body .todo-input{font-size:17px}
  .planner .empty{margin:0}
  .empty{
    text-align:center;color:var(--dim);font-size:13px;padding:26px 10px;
    border:1px dashed rgba(148,120,255,.28);border-radius:16px;margin:4px;
  }
  .empty button{font-family:inherit;color:#cbbaff;background:none;border:none;cursor:pointer;font-weight:700;margin-top:8px;font-size:13px}
  .empty button:hover{text-decoration:underline}

  .todo-row{
    display:flex;align-items:center;gap:10px;
    padding:11px 8px;
    border-bottom:1px solid rgba(148,120,255,.12);
    animation:rowIn .28s ease;
    position:relative;
  }
  .todo-row:last-child{border-bottom:none}
  @keyframes rowIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

  .check{
    width:24px;height:24px;border-radius:8px;flex-shrink:0;cursor:pointer;
    border:2px solid rgba(224,107,255,.75);
    background:linear-gradient(180deg,rgba(40,28,80,.6),rgba(22,16,52,.6));
    box-shadow:inset 0 0 10px rgba(0,0,0,.35),0 0 10px rgba(168,85,247,.2);
    display:grid;place-items:center;
    transition:.18s;
  }
  .check svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:.18s;color:#0a0716}
  .todo-row.done .check{
    background:linear-gradient(135deg,#39d98a,#22c55e);
    border-color:#7ce7b1;
    box-shadow:0 0 14px rgba(57,217,138,.55);
  }
  .todo-row.done .check svg{opacity:1;transform:scale(1)}

  .row-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .todo-input{
    font-family:inherit;font-size:15.5px;font-weight:600;color:#eee9ff;
    background:transparent;border:none;outline:none;
    padding:6px 0;width:100%;line-height:1.6;
  }
  .todo-input::placeholder{color:var(--dim);font-weight:500}
  .todo-input:placeholder-shown{
    background-image:repeating-linear-gradient(90deg,rgba(190,160,255,.38) 0 2px,transparent 2px 7px);
    background-repeat:repeat-x;background-position:0 86%;background-size:100% 1px;
  }
  .todo-row.done .todo-input{color:#8f86ba;text-decoration:line-through}
  .row-num{
    width:26px;min-width:26px;text-align:center;font-size:14px;font-weight:800;
    color:#c9b4ff;flex-shrink:0;
  }

  .row-actions{display:flex;gap:4px;opacity:0;transform:translateX(6px);transition:.18s}
  .todo-row:hover .row-actions{opacity:1;transform:none}
  .icon-btn{
    width:28px;height:28px;border-radius:8px;cursor:pointer;
    border:1px solid transparent;background:rgba(255,255,255,.04);
    color:var(--muted);display:grid;place-items:center;transition:.18s;
  }
  .icon-btn svg{width:14px;height:14px}
  .icon-btn:hover{color:#fff;background:rgba(139,92,246,.22);border-color:var(--border)}
  .icon-btn.del:hover{color:#ffb3c0;background:rgba(244,63,94,.22);border-color:rgba(244,63,94,.4)}

  /* ---------- Lessons (lined paper) ---------- */
  .lessons-panel{margin-top:22px}
  .paper-outer{padding:6px 22px 20px}
  .paper{
    position:relative;
    background:linear-gradient(180deg,rgba(24,19,58,.55),rgba(15,12,40,.55));
    border:1px solid rgba(148,120,255,.25);
    border-radius:16px;
    padding:18px 18px 6px;
    min-height:260px;
    max-height:520px;
    overflow:auto;
  }
  .paper::before{
    content:"";position:absolute;inset:14px 10px 14px 10px;pointer-events:none;
    background-image:repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 43px,
      rgba(190,160,255,.28) 43px,
      rgba(190,160,255,.28) 44px
    );
    border-radius:8px;
  }
  .paper .ruler{
    position:absolute;inset:14px 10px 14px 10px;pointer-events:none;
    border-right:2px solid rgba(255,77,109,.5);
    border-radius:2px 0 0 2px;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,77,109,0) 0,
      rgba(255,77,109,0) 43px,
      rgba(255,77,109,0) 44px
    );
  }
  .paper-content{
    position:relative;outline:none;
    font-family:'Vazirmatn',sans-serif;
    font-size:16.5px;font-weight:600;color:#efe9ff;
    line-height:44px;
    min-height:210px;
    white-space:pre-wrap;word-break:break-word;
  }
  .paper-content:empty::before{
    content:"درس‌های امروز را اینجا بنویس...";
    color:var(--dim);font-weight:500;
  }
  .paper-footer{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 4px 2px;color:var(--dim);font-size:11.5px;
  }

  /* ---------- Footer ---------- */
  .footer{
    display:flex;justify-content:space-between;align-items:center;
    margin-top:26px;padding:4px 6px;color:#5f5789;font-size:12px;
    border-top:1px solid rgba(148,120,255,.12);padding-top:16px;
  }
  .footer b{color:#cbbaff;letter-spacing:1px}

  /* ---------- Calendar modal ---------- */
  .modal-veil{
    position:fixed;inset:0;z-index:50;display:none;
    background:rgba(4,3,16,.6);backdrop-filter:blur(6px);
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-veil.open{display:flex;animation:fade .2s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .modal{
    width:min(380px,100%);
    background:linear-gradient(180deg,#1b1544,#110d30);
    border:1px solid var(--border);
    border-radius:22px;padding:20px;
    box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 40px rgba(124,58,237,.25);
    animation:pop .25s ease;
  }
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:none}}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .cal-title{font-size:16px;font-weight:800;color:#fff}
  .cal-nav{display:flex;gap:6px}
  .icon-btn.round{border-radius:10px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:rtl}
  .cal-dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700;padding:4px 0}
  .cal-day{
    font-family:inherit;font-size:13px;font-weight:700;color:#d9d0ff;
    background:rgba(255,255,255,.04);border:1px solid transparent;
    border-radius:10px;height:38px;cursor:pointer;transition:.15s;
  }
  .cal-day:hover{background:rgba(139,92,246,.25);border-color:var(--border)}
  .cal-day.dim{opacity:.32;color:var(--muted)}
  .cal-day.today{border:1px solid rgba(57,217,138,.55);color:#7ce7b1}
  .cal-day.selected{
    background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;
    box-shadow:0 6px 16px rgba(124,58,237,.5);
  }
  .cal-foot{display:flex;justify-content:center;margin-top:16px}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#201743;border:1px solid var(--border);color:#eee9ff;
    padding:10px 18px;border-radius:14px;font-size:13px;font-weight:600;
    box-shadow:0 12px 30px rgba(0,0,0,.4);opacity:0;pointer-events:none;
    transition:.25s;z-index:80;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .fade-in{animation:fadeUp .5s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- Responsive ---------- */
  @media(max-width:880px){
    .bottom-grid{grid-template-columns:1fr}
    .program-bottom{grid-template-columns:1fr}
    .date-line{flex-direction:column;align-items:flex-start}
    .day-strip{width:100%;margin-top:2px}
  }
  @media(max-width:560px){
    .shell{padding:16px 12px 22px}
    .topbar{flex-direction:column;gap:6px}
    .brand{padding:0}
    .day-strip{gap:5px}
    .day-pill{padding:7px 3px}
    .day-pill b{font-size:12px}
  }
</style>
</head>
<body>

<div class="shell">

  <!-- Header -->
  <header class="topbar fade-in">
    <div class="title-block">
      <h1>برنامه روزانه</h1>
      <p>هر روز یک قدم جلوتر ✦</p>
    </div>
    <div class="brand">
      <div class="brand-text">
        <span>The Ascent</span><br/>
        <span>Blueprint</span>
      </div>
      <div class="brand-logo"><i></i><i></i><i></i></div>
    </div>
  </header>

  <!-- Real date + week + progress -->
  <section class="date-card fade-in" style="animation-delay:.05s">
    <div class="date-line">
      <div class="date-row">
        <span class="date-label">تاریخ:</span>
        <span class="date-value" id="dateValue" title="برای انتخاب تاریخ کلیک کنید"></span>
        <button class="today-btn" id="todayBtn">امروز</button>
        <div class="head-spacer"></div>
        <button class="add-btn" id="openCalBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          تقویم
        </button>
      </div>
      <div class="day-strip" id="dayStrip"></div>
    </div>

    <div class="date-foot">
      <div class="progress-wrap">
        <div class="progress-label">
          <span>پیشرفت امروز</span>
          <span id="progressPct">۰٪</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressBar"></div></div>
      </div>
      <div class="progress-ring" id="progressRing"><span id="progressRingVal">۰٪</span></div>
      <div class="progress-wrap">
        <div class="progress-label">
          <span>تکمیل‌شده</span>
          <span id="progressCount">۰ از ۰</span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progressBar2"></div></div>
      </div>
    </div>
  </section>

  <!-- Main layout -->
  <div class="layout">

    <section class="main-area">
      <!-- برنامه امروز (همراه با اولویت‌ها و اهداف در پایین همان کادر) -->
      <div class="panel fade-in" style="animation-delay:.1s">
        <div class="panel-head">
          <span class="accent"></span>
          <h2 class="panel-title">برنامه امروز</h2>
          <div class="head-spacer"></div>
          <button class="add-btn" onclick="addItem('program')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            افزودن
          </button>
        </div>
        <div class="list-body planner" id="programList"></div>

        <div class="program-bottom">
          <!-- اولویت کارها -->
          <section class="sub-section">
            <div class="sub-head">
              <span class="accent"></span>
              <h2 class="panel-title">اولویت کارها</h2>
              <div class="head-spacer"></div>
              <button class="add-btn" onclick="addItem('priorities')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                افزودن
              </button>
            </div>
            <div class="list-body" id="prioList"></div>
          </section>

          <!-- اهداف امروز -->
          <section class="sub-section">
            <div class="sub-head">
              <span class="accent"></span>
              <h2 class="panel-title">اهداف امروز</h2>
              <div class="head-spacer"></div>
              <button class="add-btn" onclick="addItem('goals')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                افزودن
              </button>
            </div>
            <div class="list-body" id="goalList"></div>
          </section>
        </div>
      </div>
    </section>
  </div>

  <!-- Lessons -->
  <section class="panel lessons-panel fade-in" style="animation-delay:.24s">
    <div class="panel-head">
      <span class="accent"></span>
      <h2 class="panel-title">درس‌هایی که امروز گفتم</h2>
    </div>
    <div class="paper-outer">
      <div class="paper">
        <div class="ruler"></div>
        <div class="paper-content" id="lessonsContent" contenteditable="true" spellcheck="false"></div>
      </div>
      <div class="paper-footer">
        <span id="lessonsCount">۰ کلمه</span>
        <span>ذخیره‌ی خودکار ✍</span>
      </div>
    </div>
  </section>

  <footer class="footer fade-in" style="animation-delay:.3s">
    <span>روز صفر تا قله ✦</span>
    <span><b>THE ASCENT BLUEPRINT</b> · DAILY</span>
  </footer>
</div>

<!-- Calendar modal -->
<div class="modal-veil" id="modal">
  <div class="modal">
    <div class="cal-head">
      <span class="cal-title" id="calTitle"></span>
      <div class="cal-nav">
        <button class="icon-btn round" id="calPrev" title="ماه قبل">‹</button>
        <button class="icon-btn round" id="calNext" title="ماه بعد">›</button>
      </div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-foot">
      <button class="today-btn" id="calToday">برو به امروز</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ Constants ============ */
const STORAGE_KEY = 'ascent_daily_v3';
const WEEK_FA = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const MONTH_FA = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

/* ============ State ============ */
const today = new Date();
let selectedDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
let calendarDate = new Date(selectedDate.getTime());
let data = blankData();

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36); }
function iso(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function blankItem(){ return {id:uid(), text:'', done:false}; }
function blankData(){
  const seeded = {
    program:[],
    priorities:[],
    goals:[]
  };
  // همان خط‌های خالی عکس: هر کدام یک تسک/تودوی قابل تیک‌زدن است
  for(let i=0;i<6;i++) seeded.program.push(blankItem());
  for(let i=0;i<5;i++) seeded.priorities.push(blankItem());
  for(let i=0;i<4;i++) seeded.goals.push(blankItem());
  return {
    program: seeded.program,
    priorities: seeded.priorities,
    goals: seeded.goals,
    lessons:''
  };
}
function key(section, date){ return `${STORAGE_KEY}:${iso(date)}:${section}`; }

function loadData(){
  const saved = localStorage.getItem(key('all', selectedDate));
  if(saved){ try{ data = Object.assign(blankData(), JSON.parse(saved)); }catch(e){ data = blankData(); } }
  else { data = blankData(); }
}
function saveData(){
  localStorage.setItem(key('all', selectedDate), JSON.stringify(data));
}
function persist(render=true){
  saveData();
  if(render) renderAll();
}

/* ============ Date helpers ============ */
function faNumber(n){ return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]); }
function faDateLong(d){
  return new Intl.DateTimeFormat('fa-IR',{weekday:'long', day:'numeric', month:'long', year:'numeric'}).format(d);
}
function startOfWeek(d){
  const day = d.getDay(); // 0=Sun ... 6=Sat
  const offset = (day + 1) % 7; // 0 for Sat
  const s = new Date(d);
  s.setDate(d.getDate() - offset);
  s.setHours(0,0,0,0);
  return s;
}
function sameDay(a,b){ return a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }
function parseISO(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }

/* ============ Render core ============ */
function renderDateBar(){
  document.getElementById('dateValue').textContent = faDateLong(selectedDate);
  renderDayStrip();
  renderCalendar();
}

function renderDayStrip(){
  const wrap = document.getElementById('dayStrip');
  wrap.innerHTML = '';
  const start = startOfWeek(selectedDate);
  for(let i=0;i<7;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const btn = document.createElement('button');
    btn.className = 'day-pill' + (sameDay(d,selectedDate)?' active':'') + (sameDay(d,today)?' is-today':'');
    btn.innerHTML = `<b>${WEEK_FA[i]}</b><small>${faNumber(d.getDate()+' '+MONTH_FA[d.getMonth()])}</small>`;
    btn.onclick = () => { selectDate(new Date(d)); };
    wrap.appendChild(btn);
  }
}

function renderCalendar(){
  const title = document.getElementById('calTitle');
  title.textContent = `${MONTH_FA[calendarDate.getMonth()]} ${faNumber(calendarDate.getFullYear())}`;
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  WEEK_FA.forEach(w=>{
    const el = document.createElement('div');
    el.className='cal-dow'; el.textContent=w;
    grid.appendChild(el);
  });
  const first = new Date(calendarDate.getFullYear(), calendarDate.getMonth(), 1);
  const start = startOfWeek(first);
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    const btn = document.createElement('button');
    btn.className = 'cal-day';
    if(d.getMonth()!==calendarDate.getMonth()) btn.classList.add('dim');
    if(sameDay(d,today)) btn.classList.add('today');
    if(sameDay(d,selectedDate)) btn.classList.add('selected');
    btn.textContent = faNumber(d.getDate());
    btn.onclick = ()=> selectDate(new Date(d));
    grid.appendChild(btn);
  }
}

function selectDate(d){
  selectedDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  calendarDate = new Date(selectedDate);
  closeModal();
  loadData();
  renderDateBar();
  renderAll();
  toast('تاریخ تغییر کرد ✦');
}

function openModal(){
  calendarDate = new Date(selectedDate);
  renderCalendar();
  document.getElementById('modal').classList.add('open');
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
}

/* ============ Generic todo list ============ */
function addItem(list, extra={}){
  data[list].push(Object.assign({id:uid(), text:'', done:false}, extra));
  persist();
  requestAnimationFrame(()=>{
    const listId = list==='program'?'programList':list==='priorities'?'prioList':'goalList';
    const inputs = document.querySelectorAll(`#${listId} .todo-input`);
    if(inputs.length) inputs[inputs.length-1].focus();
  });
}
function updateItem(list, id, patch){
  const it = data[list].find(x=>x.id===id);
  if(it){ Object.assign(it,patch); persist(); }
}
function toggleItem(list, id){
  const it = data[list].find(x=>x.id===id);
  if(it){ it.done=!it.done; persist(); }
}
function removeItem(list, id){
  data[list] = data[list].filter(x=>x.id!==id);
  persist();
}

function renderList(list, containerId, countId, opts={}){
  const items = data[list];
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';

  if(items.length===0){
    const empty = document.createElement('div');
    empty.className='empty';
    empty.innerHTML = `<div>${opts.empty || 'هنوز موردی اضافه نکرده‌اید.'}</div>
      <button onclick="addItem('${list}')">+ افزودن اولین مورد</button>`;
    wrap.appendChild(empty);
  } else {
    items.forEach((item, idx)=>{
      const row = document.createElement('div');
      const baseClass = 'todo-row' + (item.done?' done':'');
      row.className = opts.planner ? `${baseClass} planner-row` : baseClass;
      row.dataset.id = item.id;
      row.dataset.list = list;

      const actions = `
        <div class="row-actions">
          <button class="icon-btn" title="ویرایش" onclick="focusRow(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg></button>
          <button class="icon-btn del" title="حذف" onclick="removeItem('${list}','${item.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
        </div>`;

      if(opts.planner){
        row.innerHTML = `
          <div class="planner-num">${faNumber(idx+1)}</div>
          <div class="planner-body">
            <button class="check" onclick="toggleItem('${list}','${item.id}')" aria-label="تکمیل">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
            <div class="row-body">
              <input class="todo-input" value="${escapeAttr(item.text)}" placeholder=""
                oninput="updateItemLive('${list}','${item.id}',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}" />
            </div>
            ${actions}
          </div>`;
      } else {
        row.innerHTML = `
          <button class="check" onclick="toggleItem('${list}','${item.id}')" aria-label="تکمیل">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <div class="row-body">
            <input class="todo-input" value="${escapeAttr(item.text)}" placeholder=""
              oninput="updateItemLive('${list}','${item.id}',this.value)" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur();}" />
          </div>
          ${actions}
          ${opts.numbered ? `<span class="row-num">${faNumber(idx+1)}</span>` : ''}`;
      }
      wrap.appendChild(row);
    });
  }
  const c = countId ? document.getElementById(countId) : null;
  if(c){ const done = items.filter(x=>x.done).length; c.textContent = `${faNumber(done)}/${faNumber(items.length)}`; }
}

/* live input update (without full re-render, keeps focus) */
function updateItemLive(list, id, text){
  const it = data[list].find(x=>x.id===id);
  if(it && it.text!==text){ it.text=text; persist(false); }
}
function focusRow(btn){
  const row = btn.closest('.todo-row');
  const inp = row.querySelector('.todo-input');
  if(inp){ inp.focus(); inp.select(); }
}

/* ============ Lessons ============ */
function renderLessons(){
  document.getElementById('lessonsContent').innerText = data.lessons || '';
  updateLessonCount();
}
function updateLessonCount(){
  const text = (document.getElementById('lessonsContent').innerText||'').trim();
  const words = text? text.split(/\s+/).length : 0;
  document.getElementById('lessonsCount').textContent = `${faNumber(words)} کلمه`;
}

/* ============ Progress ============ */
function renderProgress(){
  const lists = [data.program, data.priorities, data.goals];
  const total = lists.reduce((s,l)=>s+l.length,0);
  const done = lists.reduce((s,l)=>s+l.filter(x=>x.done).length,0);
  const pct = total? Math.round(done/total*100):0;
  const pctFa = faNumber(pct);
  document.getElementById('progressBar').style.width = pct+'%';
  document.getElementById('progressBar2').style.width = pct+'%';
  document.getElementById('progressRing').style.setProperty('--p', pct);
  document.getElementById('progressPct').textContent = pctFa+'٪';
  document.getElementById('progressRingVal').textContent = pctFa+'٪';
  document.getElementById('progressCount').textContent = `${faNumber(done)} از ${faNumber(total)}`;
}

/* ============ Render all ============ */
function renderAll(){
  renderDateBar();
  renderList('program','programList',null,{planner:true, empty:'برنامه‌ی امروز خالی است.'});
  renderList('priorities','prioList',null,{numbered:true, empty:'اولویت کاری ثبت نشده.'});
  renderList('goals','goalList',null,{numbered:true, empty:'هنوز هدفی برای امروز ثبت نشده.'});
  renderLessons();
  renderProgress();
}

/* ============ Utils ============ */
function escapeAttr(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'),1800);
}

/* ============ Init & events ============ */
document.getElementById('dateValue').addEventListener('click', openModal);
document.getElementById('openCalBtn').addEventListener('click', openModal);
document.getElementById('todayBtn').addEventListener('click', ()=> selectDate(new Date(today)));
document.getElementById('calToday').addEventListener('click', ()=> selectDate(new Date(today)));
document.getElementById('calPrev').addEventListener('click', ()=>{ calendarDate.setMonth(calendarDate.getMonth()-1); renderCalendar(); });
document.getElementById('calNext').addEventListener('click', ()=>{ calendarDate.setMonth(calendarDate.getMonth()+1); renderCalendar(); });
document.getElementById('modal').addEventListener('click', (e)=>{ if(e.target.id==='modal') closeModal(); });

document.getElementById('lessonsContent').addEventListener('input', (e)=>{
  data.lessons = e.target.innerText;
  persist(false);
  updateLessonCount();
});

window.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeModal(); });

loadData();
renderAll();
</script>
</body>
</html>
